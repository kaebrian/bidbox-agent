services:
  bidbox:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs
      - ./output:/app/output

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:7b && wait"]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    volumes: [n8n_data:/home/node/.n8n]
    depends_on: [bidbox, ollama]

volumes:
  ollama:
  n8n_data:
